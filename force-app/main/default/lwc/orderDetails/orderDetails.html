<template>
    <!-- Modal -->
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
        <div class="slds-modal__container">
            <!-- Modal Header -->
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" 
                        title="Close" onclick={handleClose}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
            </header>

            <!-- Modal Body -->
            <div class="slds-modal__content slds-p-around_medium">
                <template if:true={isLoading}>
                    <div class="slds-text-align_center">
                        <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
                    </div>
                </template>

                <template if:false={isLoading}>
                    <!-- Order Information -->
                    <lightning-card title="Order Information" class="slds-m-bottom_medium">
                        <div class="slds-grid slds-gutters slds-wrap">
                            <!-- Order Number -->
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-input
                                    label="Order Number"
                                    value={order.OrderNumber__c}
                                    data-field="OrderNumber__c"
                                    onchange={handleInputChange}
                                    disabled={isEditMode}
                                    required>
                                </lightning-input>
                            </div>

                            <!-- Customer -->
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-combobox
                                    label="Customer"
                                    value={selectedCustomer}
                                    options={customers}
                                    data-field="Customer__c"
                                    onchange={handleInputChange}
                                    disabled={isEditMode}
                                    required>
                                </lightning-combobox>
                            </div>

                            <!-- Order Date -->
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-input
                                    type="date"
                                    label="Order Date"
                                    value={order.OrderDate__c}
                                    data-field="OrderDate__c"
                                    onchange={handleInputChange}
                                    disabled={isEditMode}
                                    required>
                                </lightning-input>
                            </div>

                            <!-- Status -->
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <template if:true={isEditMode}>
                                    <lightning-combobox
                                        label="Status"
                                        value={order.Status__c}
                                        options={statusOptions}
                                        data-field="Status__c"
                                        onchange={handleInputChange}
                                        required>
                                    </lightning-combobox>
                                </template>
                                <template if:false={isEditMode}>
                                    <div class="slds-form-element">
                                        <label class="slds-form-element__label">Status</label>
                                        <div class="slds-form-element__control">
                                            <span class={statusClass}>{order.Status__c}</span>
                                        </div>
                                    </div>
                                </template>
                            </div>

                            <!-- Total Amount -->
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <div class="slds-form-element">
                                    <label class="slds-form-element__label">Total Amount</label>
                                    <div class="slds-form-element__control">
                                        <span class="slds-text-heading_medium">{formattedTotal}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Addresses -->
                        <div class="slds-grid slds-gutters slds-wrap slds-m-top_medium">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-textarea
                                    label="Shipping Address"
                                    value={order.ShippingAddress__c}
                                    data-field="ShippingAddress__c"
                                    onchange={handleInputChange}
                                    disabled={isEditMode}
                                    rows="3">
                                </lightning-textarea>
                            </div>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                <lightning-textarea
                                    label="Billing Address"
                                    value={order.BillingAddress__c}
                                    data-field="BillingAddress__c"
                                    onchange={handleInputChange}
                                    disabled={isEditMode}
                                    rows="3">
                                </lightning-textarea>
                            </div>
                        </div>

                        <!-- Notes -->
                        <div class="slds-m-top_medium">
                            <lightning-textarea
                                label="Notes"
                                value={order.Notes__c}
                                data-field="Notes__c"
                                onchange={handleInputChange}
                                disabled={isEditMode}
                                rows="2">
                            </lightning-textarea>
                        </div>
                    </lightning-card>

                    <!-- Order Items -->
                    <lightning-card title="Order Items" class="slds-m-bottom_medium">
                        <div slot="actions">
                            <template if:true={isEditMode}>
                                <lightning-button
                                    label="Add Item"
                                    variant="brand"
                                    onclick={handleAddItem}
                                    icon-name="utility:add">
                                </lightning-button>
                            </template>
                        </div>

                        <template if:true={hasItems}>
                            <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th class="slds-text-title_caps" scope="col">Product</th>
                                        <th class="slds-text-title_caps" scope="col">Quantity</th>
                                        <th class="slds-text-title_caps" scope="col">Unit Price</th>
                                        <th class="slds-text-title_caps" scope="col">Line Total</th>
                                        <template if:true={isEditMode}>
                                            <th class="slds-text-title_caps" scope="col">Actions</th>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={orderItems} for:item="item">
                                        <tr key={item.Id} class="slds-hint-parent">
                                            <td data-label="Product">
                                                <div class="slds-truncate">{item.ProductName__c}</div>
                                            </td>
                                            <td data-label="Quantity">
                                                <template if:true={isEditMode}>
                                                    <lightning-input
                                                        type="number"
                                                        value={item.Quantity__c}
                                                        data-item-id={item.Id}
                                                        onchange={handleItemQuantityChange}
                                                        min="1"
                                                        variant="label-hidden">
                                                    </lightning-input>
                                                </template>
                                                <template if:false={isEditMode}>
                                                    {item.Quantity__c}
                                                </template>
                                            </td>
                                            <td data-label="Unit Price">
                                                <lightning-formatted-number
                                                    value={item.UnitPrice__c}
                                                    format-style="currency"
                                                    currency-code="USD">
                                                </lightning-formatted-number>
                                            </td>
                                            <td data-label="Line Total">
                                                <lightning-formatted-number
                                                    value={item.LineTotal__c}
                                                    format-style="currency"
                                                    currency-code="USD">
                                                </lightning-formatted-number>
                                            </td>
                                            <template if:true={isEditMode}>
                                                <td data-label="Actions">
                                                    <lightning-button-icon
                                                        icon-name="utility:delete"
                                                        variant="border-filled"
                                                        alternative-text="Remove item"
                                                        title="Remove item"
                                                        data-item-id={item.Id}
                                                        onclick={handleRemoveItem}>
                                                    </lightning-button-icon>
                                                </td>
                                            </template>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>

                        <template if:false={hasItems}>
                            <div class="slds-text-align_center slds-p-around_large">
                                <lightning-icon 
                                    icon-name="standard:product_item" 
                                    size="large" 
                                    class="slds-m-bottom_medium">
                                </lightning-icon>
                                <h3 class="slds-text-heading_small">No Items Added</h3>
                                <p class="slds-text-body_regular slds-text-color_weak">
                                    Add products to this order to get started.
                                </p>
                            </div>
                        </template>
                    </lightning-card>
                </template>
            </div>

            <!-- Modal Footer -->
            <footer class="slds-modal__footer">
                <template if:true={isEditMode}>
                    <lightning-button label="Cancel" onclick={handleCancel}></lightning-button>
                    <lightning-button 
                        label="Save Order" 
                        variant="brand" 
                        onclick={handleSave}
                        disabled={isLoading}>
                    </lightning-button>
                </template>
                <template if:false={isEditMode}>
                    <lightning-button label="Close" onclick={handleClose}></lightning-button>
                    <lightning-button 
                        label="Edit Order" 
                        variant="brand" 
                        onclick={handleEdit}>
                    </lightning-button>
                </template>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>

    <!-- Add Item Modal -->
    <template if:true={showAddItemModal}>
        <c-order-item-selector
            products={products}
            onclose={handleCloseAddItem}
            onitemadded={handleItemAdded}>
        </c-order-item-selector>
    </template>
</template>
