<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A System - Local</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .qa-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .qa-list {
            margin-top: 30px;
        }

        .qa-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            position: relative;
        }

        .qa-question {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .qa-answer {
            color: #666;
            line-height: 1.6;
        }

        .qa-meta {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #999;
        }

        .delete-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff4757;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #ff3838;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            padding-left: 40px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
        }

        .search-wrapper {
            position: relative;
        }

        .stats {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
        }

        .no-results {
            text-align: center;
            color: #999;
            padding: 40px;
            font-style: italic;
        }

        .export-import-btns {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .export-import-btns button {
            flex: 1;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Local Q&A System</h1>
        
        <div class="stats">
            <div>Total Questions: <span id="totalCount">0</span></div>
        </div>

        <div class="qa-section">
            <h2>Add New Q&A</h2>
            <div class="input-section">
                <div class="input-group">
                    <label for="question">Question:</label>
                    <input type="text" id="question" placeholder="Enter your question here...">
                </div>
                <div class="input-group">
                    <label for="answer">Answer:</label>
                    <textarea id="answer" placeholder="Enter the answer here..."></textarea>
                </div>
                <button onclick="addQA()">Add Q&A</button>
            </div>

            <div class="export-import-btns">
                <button onclick="exportData()">📥 Export Q&As</button>
                <button onclick="document.getElementById('fileInput').click()">📤 Import Q&As</button>
                <input type="file" id="fileInput" accept=".json" onchange="importData(event)">
            </div>

            <div class="search-box">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search questions and answers..." onkeyup="searchQA()">
                </div>
            </div>

            <div class="qa-list" id="qaList">
                <div class="no-results">No Q&As added yet. Start by adding your first question!</div>
            </div>
        </div>
    </div>

    <script>
        // Initialize or load existing Q&As from localStorage
        let qaData = JSON.parse(localStorage.getItem('qaData')) || [];

        // Display Q&As on page load
        displayQAs();
        updateStats();

        function addQA() {
            const question = document.getElementById('question').value.trim();
            const answer = document.getElementById('answer').value.trim();

            if (!question || !answer) {
                alert('Please enter both question and answer!');
                return;
            }

            const newQA = {
                id: Date.now(),
                question: question,
                answer: answer,
                createdAt: new Date().toISOString()
            };

            qaData.unshift(newQA);
            saveData();
            displayQAs();
            updateStats();

            // Clear input fields
            document.getElementById('question').value = '';
            document.getElementById('answer').value = '';
        }

        function displayQAs(filteredData = null) {
            const qaList = document.getElementById('qaList');
            const dataToDisplay = filteredData || qaData;

            if (dataToDisplay.length === 0) {
                qaList.innerHTML = '<div class="no-results">No Q&As found.</div>';
                return;
            }

            qaList.innerHTML = dataToDisplay.map(qa => `
                <div class="qa-item">
                    <button class="delete-btn" onclick="deleteQA(${qa.id})">Delete</button>
                    <div class="qa-question">Q: ${escapeHtml(qa.question)}</div>
                    <div class="qa-answer">A: ${escapeHtml(qa.answer)}</div>
                    <div class="qa-meta">Added: ${new Date(qa.createdAt).toLocaleString()}</div>
                </div>
            `).join('');
        }

        function deleteQA(id) {
            if (confirm('Are you sure you want to delete this Q&A?')) {
                qaData = qaData.filter(qa => qa.id !== id);
                saveData();
                displayQAs();
                updateStats();
            }
        }

        function searchQA() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            
            if (!searchTerm) {
                displayQAs();
                return;
            }

            const filtered = qaData.filter(qa => 
                qa.question.toLowerCase().includes(searchTerm) || 
                qa.answer.toLowerCase().includes(searchTerm)
            );

            displayQAs(filtered);
        }

        function saveData() {
            localStorage.setItem('qaData', JSON.stringify(qaData));
        }

        function updateStats() {
            document.getElementById('totalCount').textContent = qaData.length;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function exportData() {
            if (qaData.length === 0) {
                alert('No data to export!');
                return;
            }

            const dataStr = JSON.stringify(qaData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `qa-backup-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        if (confirm(`Import ${importedData.length} Q&As? This will replace existing data.`)) {
                            qaData = importedData;
                            saveData();
                            displayQAs();
                            updateStats();
                            alert('Data imported successfully!');
                        }
                    } else {
                        alert('Invalid file format!');
                    }
                } catch (error) {
                    alert('Error reading file: ' + error.message);
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // Reset file input
        }

        // Allow adding Q&A with Enter key in question field
        document.getElementById('question').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('answer').focus();
            }
        });

        // Allow adding Q&A with Ctrl+Enter in answer field
        document.getElementById('answer').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) {
                addQA();
            }
        });
    </script>
</body>
</html>
